name: probe
on:
  push:
    branches: [probe-base, probe-fix]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cross:
    strategy:
      fail-fast: false
      matrix:
        zig_target: [arm-linux-musleabihf, arm-linux-gnueabihf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: nullclaw/nullbuilder/.github/actions/setup-zig@v1
        with:
          version: 0.16.0
      - name: Build ReleaseSmall ${{ matrix.zig_target }}
        run: zig build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSmall
      - name: Inspect binary
        run: file zig-out/bin/nullclaw && ls -l zig-out/bin/nullclaw
      - name: Smoke under qemu (musl)
        if: matrix.zig_target == 'arm-linux-musleabihf'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user >/dev/null
          qemu-arm zig-out/bin/nullclaw --version
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: nullclaw/nullbuilder/.github/actions/setup-zig@v1
        with:
          version: 0.16.0
      - run: zig fmt --check src/
      - name: zig build test --summary all
        shell: bash -eo pipefail {0}
        run: zig build test --summary all 2>&1 | tail -40
